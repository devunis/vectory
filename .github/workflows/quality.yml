name: Quality and dependency security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install -e '.[dev]' pip-audit
      - run: python -m ruff check vectory tests scripts
      - run: python -m ruff format --check vectory tests scripts
      - run: python -m pytest tests -q
      - run: python -m pip_audit .
